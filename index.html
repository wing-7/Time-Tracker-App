
<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4efe6">
	<title>Focus Timer | Time Tracker</title>
	<link rel="stylesheet" href="style.css">

</head>
<body>
	<main class="shell">
		<header class="topbar"><div class="brand"><span class="brand-mark">TT</span><span>Time Tracker</span></div><div id="status" class="status">Ready to focus</div></header>
		<section class="content">
			<div class="intro"><p class="eyebrow">Study session</p><h1>Make time<br>for progress.</h1><p>ひとつの学習に集中する時間を決めて、今日の小さな前進を積み重ねましょう。</p></div>
			<div class="workspace">
				<section class="timer-panel" aria-label="タイマー"><div class="dial" aria-live="polite"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="dial-track" cx="60" cy="60" r="53"></circle><circle id="progress" class="dial-progress" cx="60" cy="60" r="53"></circle></svg><div class="dial-copy"><div id="time" class="time">25:00</div><div id="timeLabel" class="time-label">Ready when you are</div></div></div><div class="controls"><button id="startButton" class="primary" type="button">Start timer</button><button id="resetButton" class="secondary" type="button">Reset</button></div><p class="hint">SPACE で開始 / 一時停止 ・ 終了時に通知音</p></section>
				<aside class="settings-panel"><div class="panel-heading"><h2>Session length</h2><span>Set your pace</span></div><div class="preset-list" aria-label="時間プリセット"><button class="preset active" type="button" data-minutes="25"><strong>Focus</strong><small>25 minutes</small></button><button class="preset" type="button" data-minutes="5"><strong>Quick break</strong><small>5 minutes</small></button><button class="preset" type="button" data-minutes="50"><strong>Deep work</strong><small>50 minutes</small></button><button class="preset" type="button" data-minutes="15"><strong>Short study</strong><small>15 minutes</small></button></div><label class="field-label" for="minutes">Custom duration</label><div class="duration-fields"><input id="minutes" type="number" min="0" max="999" value="25" inputmode="numeric" aria-label="分"><span class="colon">:</span><input id="seconds" type="number" min="0" max="59" value="00" inputmode="numeric" aria-label="秒"></div><div id="notice" class="notice" role="status"></div></aside>
			</div>
		</section>
	</main>
	<script src="script.js"></script>

</body>
</html>
